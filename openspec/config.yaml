schema: spec-driven

# Project context
# Aquí es donde defines de forma global tu stack y reglas del proyecto.
# Esto lo leerá la IA (yo) cada vez que vayamos a crear nuevas características.
context: |
  Dominio del Proyecto (Domain):
    Aplicación web y móvil (PWA/Responsive) orientada a los amantes del motor (coches y motos).
    Funcionalidades Core:
      - CRUD de Usuarios y Perfiles Avanzados: los usuarios deben especificar su(s) vehículo(s) aclarando tipo, marca, modelo, etc.
      - Sistema de Rutas: crear, editar y compartir rutas geolocalizadas (tipo Google Maps).
      - Álbumes de Viaje: los usuarios pueden crear álbumes de fotos de sus viajes y subir imágenes.
      - Puntos de interés (POIs) y Publicidad: añadir lugares como restaurantes u hoteles a las rutas. Se deben implementar espacios estratégicos para futura publicidad de los negocios que quieran aparecer en la plataforma.
      - Componente Social y Quedadas: unirse a rutas de otros usuarios y organizar quedadas masivas de motor.

  Tech Stack e Infraestructura:
    - Frontend: Angular (versiones modernas), Prerenderizado, SSG, PWA, SCSS.
    - UX/UI: Responsive, basado en Figma (https://www.figma.com/make/1JIqe4ZFWdNHd2gvZPHywf/Motorist-and-Car-Enthusiast-App?t=X87HuckHr5HSeZRQ-0).
    - Backend: Node.js (v24), Express.
    - Base de Datos: PostgreSQL (usando PostGIS para geolocalización).
    - Despliegue (Producción): Todo el stack se alojará en la plataforma Render.

  Directrices de Diseño (UI/UX):
    - Estilo: Limpio, moderno, minimalista pero altamente llamativo ("Premium/High-End feel").
    - Usabilidad: Enfoque principal en la usabilidad móvil (Mobile-First), dado que se usará en ruta.

  Reglas de Desarrollo (Senior Developer Mindset):
    - Calidad: Es un TFG, el código debe demostrar principios de ingeniería de software sólidos (SOLID, DRY).
    - Modularidad: Priorizar funciones pequeñas, atómicas y altamente reutilizables en todo el stack.
    - Clean Code: Nombres de variables y funciones muy descriptivos. Evitar anidaciones profundas.
    - Documentación: El código debe estar excelentemente documentado. Usar JSDoc/TSDoc para explicar funciones complejas y el "por qué" de decisiones de negocio.

# Per-artifact rules (optional)
# Reglas específicas para los documentos de OpenSpec:
rules:
  proposal:
    - Asegura siempre que la arquitectura propuesta contemple el enfoque "Mobile-First" y el diseño minimalista.
    - Para tareas de rutas, ten siempre en mente el uso óptimo de coordenadas y geolocalización.

  specs:
    - Trata las especificaciones (specs) como un contrato de comportamiento, NO como un plan de implementación.

  design:
    - Incluye archivos concretos, rutas, assets o dependencias solo cuando clarifiquen la implementación técnica.

  tasks:
    - Escribe cada tarea como un entregable atómico, concreto y testable.
    - Divide el trabajo en tareas que fuercen la creación de componentes o funciones pequeñas y altamente reutilizables.
    - Evita volver a explicar la propuesta, las especificaciones o el diseño en el texto de la tarea.

