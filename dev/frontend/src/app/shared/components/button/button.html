<button
  [type]="type()"
  [disabled]="disabled()"
  class="button"
  [ngClass]="{
    'button--cyan': variant() === 'primary',
    'button--secondary': variant() === 'secondary',
    'button--danger': variant() === 'danger',
    'u-w-full': fullWidth(),
  }"
  (click)="clicked.emit($event)"
>
  <ng-content></ng-content>
</button>
