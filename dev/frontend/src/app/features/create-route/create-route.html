<div class="create-route-container">
  <div class="sidebar">
    <h2>Crear Nueva Ruta</h2>
    <p>Haz clic en el mapa para trazar tu ruta. Añade al menos 2 puntos (origen y destino).</p>

    <div class="map-controls">
      <button type="button" class="btn btn-secondary" (click)="undoLastPoint()">
        Deshacer Último Punto
      </button>
      <button type="button" class="btn btn-danger" (click)="clearRoute()">Limpiar Mapa</button>
    </div>

    <form [formGroup]="routeForm" (ngSubmit)="onSubmit()" class="kachaoo-form mt-2">
      <div class="form-group">
        <label for="title">Título</label>
        <input id="title" type="text" formControlName="title" placeholder="Ruta por la sierra..." />
      </div>

      <div class="form-group">
        <label for="description">Descripción (Opcional)</label>
        <textarea id="description" formControlName="description" rows="3"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="vehicle_category">Vehículo</label>
          <select id="vehicle_category" formControlName="vehicle_category">
            <option value="both">Ambos</option>
            <option value="car">Coche</option>
            <option value="motorcycle">Moto</option>
          </select>
        </div>

        <div class="form-group">
          <label for="difficulty">Dificultad</label>
          <select id="difficulty" formControlName="difficulty">
            <option value="low">Baja</option>
            <option value="medium">Media</option>
            <option value="high">Alta</option>
          </select>
        </div>
      </div>

      @if (errorMessage) {
        <div class="error-msg">{{ errorMessage }}</div>
      }
      @if (successMessage) {
        <div class="success-msg">{{ successMessage }}</div>
      }

      <button
        type="submit"
        class="btn btn-primary w-100"
        [disabled]="routeForm.invalid || isSaving"
      >
        {{ isSaving ? 'Guardando...' : 'Guardar Ruta' }}
      </button>
    </form>
  </div>

  <div class="map-wrapper" #mapElement></div>
</div>
