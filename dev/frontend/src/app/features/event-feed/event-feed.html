<div class="event-feed-container">
  <div class="feed-header">
    <h2>Próximas Quedadas</h2>
    <button class="btn btn-primary" routerLink="/app/create-event">Crear Quedada</button>
  </div>

  @if (isLoading) {
    <div class="loading-state">
      <p>Cargando eventos...</p>
    </div>
  }

  @if (errorMessage) {
    <div class="error-msg">
      {{ errorMessage }}
    </div>
  }

  @if (!isLoading && events.length === 0) {
    <div class="empty-state">
      <p>No hay eventos próximos. ¡Anímate a organizar uno!</p>
    </div>
  }

  <div class="events-grid">
    @for (event of events; track event.id) {
      <app-event-card [event]="event" (attend)="attendEvent($event)"> </app-event-card>
    }
  </div>
</div>
