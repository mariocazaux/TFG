<div class="event-feed-container">
  <div class="feed-header">
    <h2>Próximas Quedadas</h2>
    <app-button variant="primary" routerLink="/app/create-event">Crear Quedada</app-button>
  </div>

  @if (errorMessage) {
    <div class="error-msg">
      {{ errorMessage }}
    </div>
  } @else if (!events || events.length === 0) {
    <div class="empty-state">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="64"
        height="64"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-calendar-days"
      >
        <path d="M8 2v4" />
        <path d="M16 2v4" />
        <rect width="18" height="18" x="3" y="4" rx="2" />
        <path d="M3 10h18" />
        <path d="M8 14h.01" />
        <path d="M12 14h.01" />
        <path d="M16 14h.01" />
        <path d="M8 18h.01" />
        <path d="M12 18h.01" />
        <path d="M16 18h.01" />
      </svg>
      <p>Próximamente nuevas rutas o eventos</p>
    </div>
  } @else {
    <div class="events-grid">
      @for (event of events; track event.id) {
        <app-event-card [event]="event" (attend)="attendEvent($event)"> </app-event-card>
      }
    </div>
  }
</div>
