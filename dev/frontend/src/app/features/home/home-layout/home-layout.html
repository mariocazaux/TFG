<div class="layout">
  <!-- Desktop Sidebar -->
  <aside class="layout__sidebar">
    <div class="brand">
      <svg
        class="brand__icon"
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
        ></path>
      </svg>
      <span class="brand__text">Kachaoo</span>
    </div>

    <nav class="layout__nav">
      <a
        routerLink="/app/profile"
        routerLinkActive="layout__nav-link--active"
        class="layout__nav-link"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          class="layout__nav-icon"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Mi Garaje
      </a>
      <!-- Map Explore -->
      <a
        routerLink="/app/map-explore"
        routerLinkActive="layout__nav-link--active"
        class="layout__nav-link"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          class="layout__nav-icon"
        >
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        Explorar Mapa
      </a>

      <!-- Event Feed -->
      <a
        routerLink="/app/event-feed"
        routerLinkActive="layout__nav-link--active"
        class="layout__nav-link"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          class="layout__nav-icon"
        >
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        Quedadas
      </a>
    </nav>

    <div class="layout__footer">
      <button class="layout__logout-btn" (click)="logout()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          class="layout__logout-icon"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="layout__main">
    <router-outlet></router-outlet>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="layout__bottom-nav">
    <a
      routerLink="/app/profile"
      routerLinkActive="layout__bottom-nav-link--active"
      class="layout__bottom-nav-link"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        class="layout__bottom-nav-icon"
      >
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Perfil</span>
    </a>
    <a class="layout__bottom-nav-link layout__bottom-nav-link--disabled">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        class="layout__bottom-nav-icon"
      >
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
      <span>Mapa</span>
    </a>
  </nav>
</div>
