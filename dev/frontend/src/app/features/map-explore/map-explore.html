<div class="map-explore-container">
  <div class="map-wrapper" #mapElement></div>

  <div class="map-overlay-ui">
    <div class="floating-header">
      <h2>Explorar Rutas</h2>
      <div class="actions">
        <app-button variant="primary" routerLink="/app/create-route">Crear Ruta</app-button>
      </div>
    </div>

    <!-- Floating suggestion -->
    @if (suggestedRoute()) {
      <div class="suggestion-panel">
        <span class="suggestion-badge">Sugerencia para ti</span>
        <div class="suggestion-content">
          <div class="info">
            <h3>{{ suggestedRoute()?.title }}</h3>
            <p>
              Distancia: {{ suggestedRoute()?.distance_km | number: '1.1-2' }} km &bull; Dificultad:
              <span [ngClass]="suggestedRoute()?.difficulty">{{
                suggestedRoute()?.difficulty
              }}</span>
            </p>
          </div>
          <app-button variant="secondary" [fullWidth]="false" routerLink="/app/events"
            >Ver Más</app-button
          >
        </div>
      </div>
    }
  </div>
</div>
