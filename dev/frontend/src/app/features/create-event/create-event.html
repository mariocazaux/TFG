<div class="create-event-container">
  <div class="sidebar">
    <h2>Crear Quedada (Estática)</h2>
    <p>
      Organiza un punto de encuentro. Haz clic en el mapa para soltar un Pin 📍 con la ubicación
      exacta.
    </p>

    <div class="map-controls">
      <button type="button" class="btn btn-danger w-100" (click)="clearPin()">Quitar Pin</button>
    </div>

    <form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="kachaoo-form mt-2">
      <div class="form-group">
        <label for="title">Título de la quedada</label>
        <input id="title" type="text" formControlName="title" placeholder="Concentración JDM..." />
      </div>

      <div class="form-group">
        <label for="description">Descripción</label>
        <textarea id="description" formControlName="description" rows="3"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="event_date">Fecha y Hora</label>
          <input id="event_date" type="datetime-local" formControlName="event_date" />
        </div>

        <div class="form-group">
          <label for="max_attendees">Aforo Máximo</label>
          <input id="max_attendees" type="number" formControlName="max_attendees" min="1" />
        </div>
      </div>

      @if (errorMessage) {
        <div class="error-msg">{{ errorMessage }}</div>
      }
      @if (successMessage) {
        <div class="success-msg">{{ successMessage }}</div>
      }

      <button
        type="submit"
        class="btn btn-primary w-100 mt-2"
        [disabled]="eventForm.invalid || isSaving"
      >
        {{ isSaving ? 'Guardando...' : 'Crear Quedada' }}
      </button>
    </form>
  </div>

  <div class="map-wrapper" #mapElement></div>
</div>
