<div class="profile">
  <div class="profile__header">
    <div
      class="profile__avatar-container"
      style="cursor: pointer"
      tabindex="0"
      role="button"
      aria-label="Cambiar avatar"
      (click)="avatarInput.click()"
      (keydown.enter)="avatarInput.click()"
    >
      <img [src]="userAvatar()" alt="User Avatar" class="profile__avatar" />
      <input
        type="file"
        #avatarInput
        style="display: none"
        accept="image/*"
        (change)="onAvatarSelected($event)"
      />
    </div>
    <div class="profile__info">
      <h1 class="profile__name">{{ userName() }}</h1>
      <p class="profile__bio">Explorador de rutas | Amante del motor</p>
    </div>
  </div>

  <div class="profile__stats">
    <div class="stat">
      <span class="stat__value">12</span>
      <span class="stat__label">Rutas</span>
    </div>
    <div class="stat">
      <span class="stat__value">4</span>
      <span class="stat__label">Vehículos</span>
    </div>
    <div class="stat">
      <span class="stat__value">1.2k</span>
      <span class="stat__label">Seguidores</span>
    </div>
  </div>

  <section class="profile__garage">
    <div class="profile__garage-header">
      <h2 class="profile__garage-title">Mi Garaje</h2>
      <button class="button button--cyan button--small" (click)="openAddModal()">+ Añadir</button>
    </div>

    <div class="profile__garage-grid">
      @for (vehicle of vehicles(); track vehicle.id) {
        <app-vehicle-card
          [vehicle]="vehicle"
          (edit)="onEditVehicle($event)"
          (delete)="onDeleteVehicle($event)"
        ></app-vehicle-card>
      } @empty {
        <div class="profile__garage-empty">
          <p>No tienes vehículos en tu garaje.</p>
          <button class="button button--secondary" (click)="openAddModal()">
            Añadir tu primer vehículo
          </button>
        </div>
      }
    </div>
  </section>

  @if (isAddModalOpen()) {
    <app-add-vehicle
      [vehicleToEdit]="vehicleToEdit()"
      (closed)="closeAddModal()"
      (vehicleAdded)="loadVehicles()"
    ></app-add-vehicle>
  }

  @if (vehicleToDelete()) {
    <app-confirm-modal
      title="Eliminar vehículo"
      [message]="
        '¿Estás seguro de que deseas eliminar el vehículo ' +
        vehicleToDelete()?.brand +
        ' ' +
        vehicleToDelete()?.model +
        '? Esta acción no se puede deshacer.'
      "
      confirmText="Eliminar"
      cancelText="Cancelar"
      confirmColorClass="button--danger"
      (confirmed)="confirmDelete()"
      (canceled)="cancelDelete()"
    ></app-confirm-modal>
  }
</div>
